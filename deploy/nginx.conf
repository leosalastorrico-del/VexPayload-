# nginx front for VexC2 3.0. Replace the domain and certificate paths.
server {
    listen 443 ssl http2;
    server_name c2.example.tld;

    ssl_certificate     /etc/letsencrypt/live/c2.example.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c2.example.tld/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;          # proof uploads
    server_tokens off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        # Overwrite, never append: the app reads the first hop only when
        # VEX_TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # operator panel: restrict to your exit IPs at the edge as well
    # location /admin {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://127.0.0.1:5000;
    # }
}

server {
    listen 80;
    server_name c2.example.tld;
    return 301 https://$host$request_uri;
}
