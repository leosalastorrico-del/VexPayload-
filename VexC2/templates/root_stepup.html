{% extends "base.html" %}
{% block title %}root step-up{% endblock %}
{% block content %}
<h1>Root step-up</h1>
<p class="sub">Confirm your identity to unlock destructive root actions for 5 minutes.</p>
<div class="panel" style="max-width:420px">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Step-up password</label>
    <input type="password" name="password" autocomplete="current-password"
           inputmode="numeric" autofocus placeholder="16-digit step-up password">
    <div style="height:10px"></div>
    <button class="btn" type="submit">UNLOCK ROOT ACTIONS</button>
  </form>
</div>
{% endblock %}
